services:
  - type: web
    name: bluroyal-dj-app
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: HOST
        value: 0.0.0.0
      - key: DASHBOARD_USERNAME
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: ACADEMY_APP_USERNAME
        sync: false
      - key: ACADEMY_APP_PASSWORD
        sync: false
      - key: MT360_ADMIN_USERNAME
        sync: false
      - key: MT360_ADMIN_PASSWORD
        sync: false
      - key: POST_PURCHASE_LOGIN_URL
        value: https://app.bluroyaladventures.com/academy/login
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SQUARE_ACCESS_TOKEN
        sync: false
      - key: WIX_API_KEY
        sync: false
      - key: WIX_SITE_ID
        sync: false
      - key: WIX_WEBHOOK_SECRET
        sync: false
      - key: LANGCHAIN_API_KEY
        sync: false
