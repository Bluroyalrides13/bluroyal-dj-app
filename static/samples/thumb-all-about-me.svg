<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Blu Royal Academy Branded Fallback</title>
  <desc id="desc">Brand-safe preschool resource placeholder with Blu Royal Academy styling.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7fbff"/>
      <stop offset="100%" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f6f9ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <rect x="40" y="40" width="1120" height="680" rx="36" fill="url(#card)" stroke="#143a7a" stroke-width="4"/>

  <circle cx="178" cy="140" r="92" fill="#0b2f6f"/>
  <text x="178" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#ffd15c">BLU ROYAL</text>
  <text x="178" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">ACADEMY</text>

  <rect x="330" y="86" width="540" height="56" rx="18" fill="#2f6feb"/>
  <text x="600" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#ffffff">BRANDED RESOURCE PREVIEW</text>

  <text x="600" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="70" font-weight="900" fill="#133b86">BUILT FOR</text>
  <text x="600" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="104" font-weight="900" fill="#ea2f86">PRESCHOOL</text>
  <text x="600" y="402" text-anchor="middle" font-family="Arial, sans-serif" font-size="52" font-weight="800" fill="#1f2f55">Less blank space. More Blu Royal style.</text>

  <rect x="120" y="470" width="960" height="150" rx="26" fill="#f4f9ff" stroke="#b8c9ea" stroke-width="2"/>
  <text x="160" y="530" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="#48a33a">What you will see</text>
  <text x="160" y="582" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1f2f55">Blue and pink brand styling, classroom-friendly layout, and a clear resource title area.</text>

  <rect x="40" y="688" width="1120" height="32" fill="#143a7a"/>
</svg>
