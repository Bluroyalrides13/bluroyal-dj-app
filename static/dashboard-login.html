<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DJ Dashboard Login</title>
  <style>
    :root {
      --bg: #0d0f1a;
      --card: #151827;
      --line: rgba(255,255,255,0.1);
      --text: #f0f2ff;
      --muted: #8c93b9;
      --accent: #ff3d8d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top left, rgba(255,61,141,0.16), transparent 30%),
        radial-gradient(circle at top right, rgba(15,187,143,0.12), transparent 30%),
        var(--bg);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      color: var(--text);
      padding: 20px;
    }
    .card {
      width: min(460px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.35);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.5rem;
      letter-spacing: -0.03em;
    }
    p {
      margin: 0 0 20px;
      color: var(--muted);
      line-height: 1.6;
      font-size: 0.95rem;
    }
    .field { margin-bottom: 14px; }
    label {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #1d2237;
      color: var(--text);
      font: inherit;
    }
    input:focus {
      outline: none;
      border-color: var(--accent);
    }
    .btn {
      width: 100%;
      border: none;
      border-radius: 999px;
      padding: 12px 16px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      background: linear-gradient(135deg, var(--accent), #ff7a59);
      color: #fff;
      margin-top: 8px;
    }
    .error {
      background: rgba(255, 74, 109, 0.12);
      border: 1px solid rgba(255, 74, 109, 0.35);
      color: #ff9ab2;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 0.88rem;
      margin-bottom: 14px;
      display: none;
    }
    .error.show { display: block; }
  </style>
</head>
<body>
  <main class="card">
    <h1>DJ Business Engine Login</h1>
    <p>Enter your buyer access credentials to open the dashboard tools.</p>

    <div id="error" class="error">Incorrect username or password.</div>

    <form method="post" action="/dashboard/login">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </div>
      <button class="btn" type="submit">Log In</button>
    </form>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.get('error') === '1') {
      document.getElementById('error').classList.add('show');
    }
  </script>
</body>
</html>
