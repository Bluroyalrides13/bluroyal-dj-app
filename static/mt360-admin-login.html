<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MultiTasking360 Admin Login</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap');

    :root {
      --bg: #0a1118;
      --surface: #0f1b26;
      --border: rgba(201, 168, 109, 0.18);
      --text: #f7f2e8;
      --muted: #bcae93;
      --accent: #c9a86d;
      --accent2: #84b6a4;
      --radius: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Manrope", sans-serif;
      background:
        radial-gradient(1200px 500px at 85% -120px, rgba(201,168,109,0.15), transparent 55%),
        radial-gradient(1000px 400px at -10% -60px, rgba(132,182,164,0.12), transparent 50%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      background: linear-gradient(135deg, var(--surface) 0%, rgba(15,27,38,0.8) 100%);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 48px 40px;
      box-shadow:
        0 8px 32px rgba(0,0,0,0.4),
        inset 0 1px 0 rgba(255,255,255,0.08);
    }

    .login-header {
      text-align: center;
      margin-bottom: 36px;
    }

    .login-header__title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(135deg, var(--text), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .login-header__subtitle {
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.5px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .form-input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(0,0,0,0.2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      transition: all 0.25s ease;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--accent2);
      background: rgba(132,182,164,0.08);
      box-shadow: 0 0 0 3px rgba(132,182,164,0.12);
    }

    .form-input::placeholder {
      color: var(--muted);
    }

    .error-message {
      display: none;
      padding: 12px 14px;
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 8px;
      color: #fca5a5;
      font-size: 13px;
      margin-bottom: 20px;
    }

    .error-message.show {
      display: block;
    }

    .form-submit {
      width: 100%;
      padding: 14px 24px;
      background: linear-gradient(135deg, var(--accent) 0%, #d4af37 100%);
      border: none;
      border-radius: 10px;
      color: #0a1118;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .form-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(201,168,109,0.3);
    }

    .form-submit:active {
      transform: translateY(0);
    }

    .form-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <div class="login-header__title">MultiTasking360</div>
      <div class="login-header__subtitle">Admin Applications Portal</div>
    </div>

    <div class="error-message" id="error"></div>

    <form id="login-form" method="POST">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input
          type="text"
          class="form-input"
          name="username"
          placeholder="Enter your username"
          required
          autocomplete="username"
        />
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input
          type="password"
          class="form-input"
          name="password"
          placeholder="Enter your password"
          required
          autocomplete="current-password"
        />
      </div>

      <button type="submit" class="form-submit">Sign In</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const errorDiv = document.getElementById('error');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorDiv.classList.remove('show');

      const formData = new FormData(form);
      const submitBtn = form.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';

      try {
        const response = await fetch('/mt360-admin/login', {
          method: 'POST',
          body: formData,
        });

        if (response.ok) {
          window.location.href = '/mt360-admin';
        } else {
          errorDiv.textContent = 'Incorrect username or password.';
          errorDiv.classList.add('show');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In';
        }
      } catch (err) {
        errorDiv.textContent = 'An error occurred. Please try again.';
        errorDiv.classList.add('show');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    });

    // Show error if URL has error param
    if (new URLSearchParams(window.location.search).has('error')) {
      errorDiv.textContent = 'Incorrect username or password.';
      errorDiv.classList.add('show');
    }
  </script>
</body>
</html>
